name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match pyproject.toml)
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macOS-arm64
          - os: macos-15-intel
            target: macOS-x64
          - os: windows-2022
            target: Windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -c "import os,tomllib; assert os.environ['RELEASE_TAG'] == 'v'+tomllib.load(open('pyproject.toml','rb'))['project']['version']"
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements.txt && python -m pip install --no-deps .
      - name: Test project helper entry
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p test_release_entry.py
      - name: Build native application
        run: python -m PyInstaller --noconfirm --clean packaging/neo-tracker.spec
      - name: Smoke test shipped executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          binary = Path('dist/Neo-Tracker.app/Contents/MacOS/Neo-Tracker') if sys.platform == 'darwin' else Path('dist/Neo-Tracker/Neo-Tracker.exe')
          subprocess.run([str(binary.resolve()), '--smoke-test', '--output', str(Path('build/frozen-smoke.json').resolve()), '--media', str(Path('artifacts/experiment-videos/red-dot-tracking.mp4').resolve())], check=True, timeout=180)
          print(Path('build/frozen-smoke.json').read_text())
          PY
      - name: Archive application
        run: python packaging/archive_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/frozen-smoke.json
            build/neo-tracker/warn-neo-tracker.txt
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify asset checksums
        run: cd release-assets && sha256sum -c *-SHA256SUMS.txt
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch --tags origin
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "Neo-Tracker $RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
