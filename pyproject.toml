[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-tracker"
version = "0.1.0"
description = "Adaptive physics video tracking toolkit with composable tracking pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
science = ["scipy>=1.12"]
media = ["opencv-python>=4.9"]
dev = ["pytest>=8"]

[project.scripts]
neo-tracker = "neo_tracker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neo_tracker*"]
